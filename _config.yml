title: 우아복권 - 우리 동네 로또 판매점·복권방 찾기
description: >-
  동네 이름으로 로또 판매점과 복권방을 찾아보세요. 전국 복권 판매점 주소와 최근 1년 로또 1등 자동 당첨 판매점을
  공공데이터로 안내합니다.
url: "https://wooalotto.wooahouse.com"
baseurl: ""
lang: ko
timezone: Asia/Seoul
author: WooaHouse

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false

plugins:
  - jekyll-seo-tag

exclude:
  - Gemfile
  - Gemfile.lock
  - scripts/
  - data/
  - "*.py"
  - "*.log"
  - README.md
  - .gitignore
  - .env
  - vendor/
  - _rawdata/

# 설계 메모: 기획예산처 복권판매점 목록(23.5k) + 온라인복권 1등 당첨 판매점 현황(463곳, 자동 1등만, 시군구까지) 결합.
# 도로명주소→법정동은 카카오 지오코딩(scripts/geocode_lotto.py, 캐시 data/raw/geocode_lotto_cache.json).
# 사이트맵은 lotto_generator.rb 분할본.
